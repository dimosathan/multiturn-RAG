[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtrag"
version = "1.0.0"
description = "AILS-NTUA system for SemEval-2026 Task 8 (MTRAGEval): nested-RRF query diversity and evidence-grounded agentic generation for multi-turn RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dimosthenis Athanasiou" }]
dependencies = [
  "requests>=2.31",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
retrieval = ["elasticsearch>=8.10,<9"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
