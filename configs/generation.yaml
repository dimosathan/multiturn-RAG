# Generation configuration

# Models
span_extractor_model: deepseek-v3.2
generator_model: gpt-4o
technical_judge_model: deepseek-v3.2
user_judge_model: gpt-4o-mini
adjustment_model: gpt-4o-mini

# Generation parameters
temperature_main: 0.0
temperature_secondary: 0.1

# Pipeline settings
max_spans: 8
use_dual_generation: true
use_judge: true
use_micro_adjustment: true

# Answerability
enable_answerability: true

# Limits
max_tokens: 512
