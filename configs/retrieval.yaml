# Retrieval configuration

# Models
rewriter_model: deepseek-v3.2
reranker_model: cohere-rerank-v4

# Retrieval backend
retriever: elser-v1
top_k_retrieve: 100
top_k_final: 10

# Query rewriting strategies
use_minimal: true
use_corpus_specific: true
use_hyde: true
use_cot: true
use_anchor_keywords: true

# Fusion
fusion_method: nested_rrf
rrf_k: 60

# Nested RRF weights
weights:
  minimal: 1.0
  corpus: 1.2
  hyde: 1.0
  cot: 0.8
  anchor: 1.1

# Misc
batch_size: 8
